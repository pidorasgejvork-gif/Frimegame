<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON JUMP: Multiverse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { 
            margin: 0; padding: 0; overflow: hidden; background: #000; 
            display: flex; justify-content: center; align-items: center; height: 100vh; 
            font-family: 'Outfit', sans-serif; touch-action: none; 
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        #top-ui { 
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            color: #fff; pointer-events: none; text-align: center; z-index: 10;
            display: flex; flex-direction: column; align-items: center;
        }
        #score-label { font-size: 10px; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; opacity: 0.6; margin-bottom: -2px; }
        #score { font-size: 42px; font-weight: 900; letter-spacing: -1px; text-shadow: 0 0 20px rgba(255,255,255,0.5); line-height: 1; }
        
        .stats-row { display: flex; gap: 10px; margin-top: 5px; }
        .stat-badge {
            display: flex; align-items: center; gap: 5px;
            font-size: 13px; font-weight: 900; background: rgba(0,0,0,0.5);
            padding: 4px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-badge.highscore { color: #ffcc00; text-shadow: 0 0 10px rgba(255, 204, 0, 0.4); border-color: rgba(255, 204, 0, 0.3); }
        .stat-badge.coins { color: #00ff88; text-shadow: 0 0 10px rgba(0, 255, 136, 0.4); border-color: rgba(0, 255, 136, 0.3); }
        .stat-badge svg { width: 14px; height: 14px; fill: currentColor; }

        .top-btn {
            position: absolute; top: 20px; z-index: 30; cursor: pointer;
            width: 44px; height: 44px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; gap: 4px;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px; backdrop-filter: blur(5px); transition: 0.2s;
        }
        .top-btn:hover { background: rgba(255,255,255,0.2); }
        .top-btn:active { transform: scale(0.95); }
        
        #pause-btn { left: 20px; }
        #menu-btn { right: 20px; }

        .pause-icon { width: 16px; height: 18px; border-left: 5px solid #fff; border-right: 5px solid #fff; }
        .menu-icon { width: 20px; height: 2px; background: #fff; position: relative; }
        .menu-icon::before, .menu-icon::after { content: ''; position: absolute; left: 0; width: 20px; height: 2px; background: #fff; }
        .menu-icon::before { top: -6px; }
        .menu-icon::after { top: 6px; }

        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(12px);
            display: none; justify-content: center; align-items: center;
            z-index: 40; padding: 15px;
        }
        .modal-overlay.open { display: flex; }

        .modal-box {
            background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
            border: 1px solid #333; border-radius: 24px;
            width: 100%; max-width: 420px; padding: 25px; color: #fff;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 40px rgba(255,255,255,0.05);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; text-align: center;
            max-height: 90vh; overflow-y: auto;
        }
        @keyframes popIn { from { transform: scale(0.85) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }

        .modal-title { font-size: 24px; font-weight: 900; margin-bottom: 15px; letter-spacing: -1px; text-transform: uppercase; }
        
        .close-btn {
            position: absolute; top: 15px; right: 15px; width: 30px; height: 30px;
            background: rgba(255,255,255,0.1); border: none; border-radius: 50%;
            color: #fff; font-size: 16px; cursor: pointer; display: flex;
            justify-content: center; align-items: center; transition: 0.2s; z-index: 2;
        }
        .close-btn:hover { background: rgba(255,255,255,0.2); transform: rotate(90deg); }

        .tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab {
            flex: 1; padding: 10px; background: #1a1a1a; border: 1px solid #333;
            border-radius: 10px; text-align: center; font-weight: 700; font-size: 12px;
            cursor: pointer; transition: 0.2s; color: #888;
        }
        .tab.active { background: #fff; color: #000; border-color: #fff; }
        
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .shop-item {
            background: #1a1a1a; border: 1px solid #333; border-radius: 14px;
            padding: 12px; display: flex; flex-direction: column; align-items: center;
            transition: 0.2s;
        }
        .shop-item.owned { border-color: #00ff88; background: rgba(0, 255, 136, 0.05); }
        .shop-item.active-item { border-color: #00ffff; background: rgba(0, 255, 255, 0.1); box-shadow: 0 0 15px rgba(0, 255, 255, 0.2); }
        .shop-preview { width: 50px; height: 50px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: center; align-items: center; font-size: 24px; background-size: cover; }
        .shop-name { font-size: 12px; font-weight: 700; margin-bottom: 5px; }
        .shop-btn {
            width: 100%; padding: 8px; border-radius: 8px; border: none;
            font-family: 'Outfit'; font-weight: 900; font-size: 11px; cursor: pointer;
            background: #333; color: #fff; transition: 0.2s;
        }
        .shop-btn:hover { background: #444; }
        .shop-btn.buy { background: #ffcc00; color: #000; }
        .shop-btn.buy:hover { background: #ffdd44; }
        .shop-btn.equip { background: #00ffff; color: #000; }
        .btn-cheat { background: #ff3366 !important; color: #fff !important; font-weight: 900; margin-top: 10px; }
        .btn-cheat:hover { background: #ff4775 !important; }

        .setting-row { margin-bottom: 15px; text-align: left; }
        .setting-label { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; margin-bottom: 5px; color: #aaa; text-transform: uppercase; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; outline: none; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; background: #222; border-radius: 3px; cursor: pointer; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%;
            background: #fff; cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px rgba(255,255,255,0.4);
        }

        .pause-btn { width: 100%; padding: 15px; margin-bottom: 8px; border-radius: 12px; border: none; font-family: 'Outfit'; font-size: 16px; font-weight: 900; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .btn-resume { background: #fff; color: #000; }
        .btn-resume:hover { background: #ddd; transform: scale(1.02); }
        .btn-restart { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid #333; }
        .btn-restart:hover { background: rgba(255,255,255,0.1); transform: scale(1.02); }

        .gameover-title { color: #ff3366; text-shadow: 0 0 30px rgba(255, 51, 102, 0.5); font-size: 32px; margin-bottom: 5px; }
        .final-score { font-size: 60px; font-weight: 900; color: #fff; line-height: 1; margin-bottom: 20px; text-shadow: 0 0 30px rgba(255,255,255,0.3); }
        .record-badge {
            display: inline-block; background: rgba(255, 215, 0, 0.15); color: #ffd700;
            padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 900;
            letter-spacing: 1px; margin-bottom: 15px; border: 1px solid rgba(255, 215, 0, 0.3);
            text-transform: uppercase; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    
    <div id="top-ui">
        <div id="score-label">Score</div>
        <div id="score">0</div>
        <div class="stats-row">
            <div class="stat-badge highscore">
                <svg viewBox="0 0 24 24"><path d="M19 3h-2V1H7v2H5c-1.1 0-2 .9-2 2v3c0 2.4 1.7 4.4 4 4.9V15c0 1.1.9 2 2 2h2v2H8v2h8v-2h-3v-2h2c1.1 0 2-.9 2-2v-2.1c2.3-.5 4-2.5 4-4.9V5c0-1.1-.9-2-2-2zM5 8V5h2v3c0 1-.4 1.9-1 2.5C5.4 9.9 5 9 5 8zm14 0c0 1-.4 1.9-1 2.5-.6-.6-1-1.5-1-2.5V5h2v3z"/></svg>
                <span id="highscore">0</span>
            </div>
            <div class="stat-badge coins">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
                <span id="coins-display">0</span>
            </div>
        </div>
    </div>
    
    <div id="pause-btn" class="top-btn" onclick="togglePause()"><div class="pause-icon"></div></div>
    <div id="menu-btn" class="top-btn" onclick="openMenu()"><div class="menu-icon"></div></div>

    <div id="pause-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title">PAUSED</div>
            <button class="pause-btn btn-resume" onclick="togglePause()">RESUME</button>
            <button class="pause-btn btn-restart" onclick="restartGame()">RESTART</button>
            <button class="pause-btn btn-restart" onclick="goToMenu()">MAIN MENU</button>
        </div>
    </div>

    <div id="menu-modal" class="modal-overlay">
        <div class="modal-box">
            <button class="close-btn" onclick="closeMenu()">✕</button>
            <div class="modal-title">SHOP & SETTINGS</div>
            
            <div class="tabs">
                <div class="tab active" onclick="switchTab('chars', this)">Characters</div>
                <div class="tab" onclick="switchTab('levels', this)">Locations</div>
                <div class="tab" onclick="switchTab('settings', this)">Settings</div>
            </div>

            <div id="tab-chars" class="tab-content active">
                <div class="shop-grid" id="chars-grid"></div>
            </div>

            <div id="tab-levels" class="tab-content">
                <div class="shop-grid" id="levels-grid"></div>
            </div>

            <div id="tab-settings" class="tab-content">
                <div class="setting-row">
                    <div class="setting-label"><span>Sound Volume</span><span id="sound-val">50%</span></div>
                    <input type="range" id="sound-slider" min="0" max="100" value="50">
                </div>
                <div class="setting-row">
                    <div class="setting-label"><span>Sensitivity</span><span id="sens-val">50%</span></div>
                    <input type="range" id="sens-slider" min="10" max="100" value="50">
                </div>
                <button class="shop-btn btn-cheat" onclick="cheatCoins()">GIVE 9999 COINS 💰</button>
            </div>
        </div>
    </div>

    <div id="game-over-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title gameover-title">GAME OVER</div>
            <div class="final-score" id="final-score">0</div>
            <div id="record-badge" class="record-badge" style="display: none;">🏆 New Record!</div>
            <button class="pause-btn btn-resume" onclick="restartGame()">TRY AGAIN</button>
            <button class="pause-btn btn-restart" onclick="goToMenu()">SHOP</button>
        </div>
    </div>

<script>
    // --- ЗВУК ---
    let audioCtx = null;
    let soundVolume = 0.5;
    let sensitivity = 1.0;

    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playSound(freq, type, duration) {
        if (soundVolume === 0) return;
        try {
            initAudio();
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(soundVolume * 0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    // --- ДАННЫЕ МАГАЗИНА (ОБНОВЛЕНО) ---
    const characters = [
        { id: 'default', name: 'Classic', price: 0 },
        { id: 'ninja', name: 'Cyber Ninja', price: 50 },
        { id: 'golden_bear', name: 'Golden Bear', price: 150 },
        { id: 'ghost', name: 'Ghost', price: 300 },
        { id: 'goblin', name: 'Goblin', price: 400 },
        { id: 'spider', name: 'Spider', price: 500 },
        { id: 'robot', name: 'Robot', price: 600 },
        { id: 'gecko', name: 'Gecko', price: 700 },
        { id: 'axolotl', name: 'Axolotl', price: 800 }
    ];

    const locations = [
        { id: 'space', name: 'Neon Space', price: 0, bg1: '#050510', bg2: '#000000', nebula: ['rgba(0,255,255,0.05)', 'rgba(255,0,255,0.05)'] },
        { id: 'volcano', name: 'Volcano', price: 100, bg1: '#1a0505', bg2: '#000000', nebula: ['rgba(255,50,0,0.1)', 'rgba(255,150,0,0.05)'] },
        { id: 'ice', name: 'Ice Cave', price: 200, bg1: '#05101a', bg2: '#000000', nebula: ['rgba(0,100,255,0.1)', 'rgba(0,255,255,0.05)'] },
        { id: 'sakura', name: 'Sakura', price: 300, bg1: '#1a0510', bg2: '#000000', nebula: ['rgba(255,100,150,0.1)', 'rgba(255,200,200,0.05)'] },
        { id: 'ocean', name: 'Ocean', price: 400, bg1: '#001a2a', bg2: '#000000', nebula: ['rgba(0,100,255,0.1)', 'rgba(0,255,200,0.05)'] }
    ];

    let ownedChars = JSON.parse(localStorage.getItem('nj_ownedChars') || '["default"]');
    let ownedLocs = JSON.parse(localStorage.getItem('nj_ownedLocs') || '["space"]');
    let currentChar = localStorage.getItem('nj_currentChar') || 'default';
    let currentLoc = localStorage.getItem('nj_currentLoc') || 'space';
    let coins = parseInt(localStorage.getItem('nj_coins') || '0');
    let highScore = parseInt(localStorage.getItem('nj_highscore') || '0');

    document.getElementById('coins-display').innerText = coins;
    document.getElementById('highscore').innerText = highScore;

    // --- UI МАГАЗИНА ---
    function renderShop() {
        const charsGrid = document.getElementById('chars-grid');
        charsGrid.innerHTML = characters.map(c => {
            const isOwned = ownedChars.includes(c.id);
            const isActive = currentChar === c.id;
            // Иконки для превью (упрощенные стили)
            let previewStyle = '';
            if (c.id === 'default') previewStyle = 'background: #fff;';
            if (c.id === 'ninja') previewStyle = 'background: #1a1a1a; color: #00ffff; border: 2px solid #00ffff;';
            if (c.id === 'golden_bear') previewStyle = 'background: #ffcc00; color: #000;';
            if (c.id === 'ghost') previewStyle = 'background: rgba(255,0,255,0.3); color: #ff00ff; border: 2px solid #ff00ff;';
            if (c.id === 'goblin') previewStyle = 'background: #006600; color: #00ff00;';
            if (c.id === 'spider') previewStyle = 'background: #111; color: #ff0000;';
            if (c.id === 'robot') previewStyle = 'background: #aaa; color: #000;';
            if (c.id === 'gecko') previewStyle = 'background: #00ff00; color: #006600;';
            if (c.id === 'axolotl') previewStyle = 'background: #ffb6c1; color: #ff69b4;';

            return `
                <div class="shop-item ${isOwned ? 'owned' : ''} ${isActive ? 'active-item' : ''}">
                    <div class="shop-preview" style="${previewStyle}">${isActive ? '👤' : ''}</div>
                    <div class="shop-name">${c.name}</div>
                    ${isOwned 
                        ? (isActive ? `<button class="shop-btn equip" disabled>EQUIPPED</button>` : `<button class="shop-btn equip" onclick="equipChar('${c.id}')">EQUIP</button>`)
                        : `<button class="shop-btn buy" onclick="buyChar('${c.id}', ${c.price})">${c.price} 🪙</button>`
                    }
                </div>
            `;
        }).join('');

        const locsGrid = document.getElementById('levels-grid');
        locsGrid.innerHTML = locations.map(l => {
            const isOwned = ownedLocs.includes(l.id);
            const isActive = currentLoc === l.id;
            return `
                <div class="shop-item ${isOwned ? 'owned' : ''} ${isActive ? 'active-item' : ''}">
                    <div class="shop-preview" style="background: linear-gradient(135deg, ${l.bg1}, ${l.bg2}); border: 1px solid ${l.nebula[0]};"></div>
                    <div class="shop-name">${l.name}</div>
                    ${isOwned 
                        ? (isActive ? `<button class="shop-btn equip" disabled>EQUIPPED</button>` : `<button class="shop-btn equip" onclick="equipLoc('${l.id}')">EQUIP</button>`)
                        : `<button class="shop-btn buy" onclick="buyLoc('${l.id}', ${l.price})">${l.price} 🪙</button>`
                    }
                </div>
            `;
        }).join('');
    }

    function cheatCoins() { coins += 9999; localStorage.setItem('nj_coins', coins); document.getElementById('coins-display').innerText = coins; playSound(1000, 'square', 0.3); renderShop(); }
    function buyChar(id, price) { if (coins >= price) { coins -= price; ownedChars.push(id); localStorage.setItem('nj_coins', coins); localStorage.setItem('nj_ownedChars', JSON.stringify(ownedChars)); document.getElementById('coins-display').innerText = coins; playSound(600, 'sine', 0.1); renderShop(); } else playSound(100, 'square', 0.2); }
    function equipChar(id) { currentChar = id; localStorage.setItem('nj_currentChar', id); renderShop(); }
    function buyLoc(id, price) { if (coins >= price) { coins -= price; ownedLocs.push(id); localStorage.setItem('nj_coins', coins); localStorage.setItem('nj_ownedLocs', JSON.stringify(ownedLocs)); document.getElementById('coins-display').innerText = coins; playSound(600, 'sine', 0.1); renderShop(); } else playSound(100, 'square', 0.2); }
    function equipLoc(id) { currentLoc = id; localStorage.setItem('nj_currentLoc', id); renderShop(); }
    function switchTab(tabName, btn) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active'); document.getElementById('tab-' + tabName).classList.add('active');
    }

    // --- КАНВАС ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resizeCanvas() {
        if (window.innerWidth > 600) { width = 600; height = Math.min(window.innerHeight, 900); } 
        else { width = window.innerWidth; height = window.innerHeight; }
        canvas.width = width; canvas.height = height;
    }
    resizeCanvas();
    window.addEventListener('resize', () => { resizeCanvas(); initPlatforms(); });

    // --- ИГРОВЫЕ ПЕРЕМЕННЫЕ ---
    let gameState = 'playing', prevGameState = 'playing'; 
    let score = 0, particles = [], bgParticles = [], stars = [], nebulas = [], gameCoins = [];
    const GRAVITY = 0.55, JUMP_FORCE = -15, SPRING_FORCE = -25;

    const player = { x: width / 2 - 20, y: height - 150, vx: 0, vy: 0, width: 36, height: 36, tilt: 0, time: 0 };
    let platforms = [];
    const PLATFORM_WIDTH = 80, PLATFORM_HEIGHT = 20;
    let keys = { left: false, right: false };
    let pointerActive = false, pointerStartX = 0, pointerCurrentX = 0, usePointer = false;

    function createPlatform(y, type = 'normal') {
        let x = Math.random() * (width - PLATFORM_WIDTH);
        let platform = { x, y, width: PLATFORM_WIDTH, height: PLATFORM_HEIGHT, type, vx: type === 'moving' ? (Math.random() > 0.5 ? 3 : -3) : 0, broken: false, breakTimer: 0, hasSpring: false, hasCoin: false };
        if (score > 5000) {
            const r = Math.random();
            if (r < 0.15 && type !== 'breakable') platform.hasSpring = true;
            else if (r < 0.3) platform.hasCoin = true;
        }
        return platform;
    }

    function initPlatforms() {
        platforms = []; gameCoins = [];
        platforms.push({ x: width / 2 - PLATFORM_WIDTH / 2, y: height - 100, width: PLATFORM_WIDTH, height: PLATFORM_HEIGHT, type: 'normal', vx: 0, broken: false, breakTimer: 0, hasSpring: false, hasCoin: false });
        let currentY = height - 200;
        while (currentY > -height) {
            let type = 'normal'; const r = Math.random();
            if (r < 0.25) type = 'breakable'; else if (r < 0.5) type = 'moving';
            platforms.push(createPlatform(currentY, type));
            currentY -= (80 + Math.random() * 50);
        }
    }

    function generateNewPlatforms() {
        let minY = 0; platforms.forEach(p => { if (p.y < minY) minY = p.y; });
        if (minY > -height) {
            let type = 'normal'; const r = Math.random();
            if (r < 0.25) type = 'breakable'; else if (r < 0.5) type = 'moving';
            platforms.push(createPlatform(minY - (80 + Math.random() * 50), type));
        }
    }

    function initStars() {
        stars = []; nebulas = []; bgParticles = [];
        for(let i=0; i<100; i++) {
            stars.push({ x: Math.random() * width, y: Math.random() * height, size: Math.random() * 2 + 0.5, speed: Math.random() * 3 + 1, layer: Math.random() > 0.5 ? 1 : 2 });
        }
        for(let i=0; i<5; i++) {
            nebulas.push({ x: Math.random() * width, y: Math.random() * height, radius: Math.random() * 200 + 100, speed: Math.random() * 0.5 + 0.2 });
        }
        for(let i=0; i<80; i++) {
            bgParticles.push({ x: Math.random() * width, y: Math.random() * height, speed: Math.random() * 2 + 1, size: Math.random() * 3 + 1, rot: Math.random()*Math.PI });
        }
    }

    // --- УПРАВЛЕНИЕ ---
    window.addEventListener('keydown', (e) => { if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true; if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true; });
    window.addEventListener('keyup', (e) => { if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false; if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false; });

    function handlePointerDown(e) { if (e.target.closest('.top-btn') || e.target.closest('.modal-overlay')) return; pointerActive = true; pointerStartX = e.touches ? e.touches[0].clientX : e.clientX; pointerCurrentX = pointerStartX; usePointer = true; }
    function handlePointerMove(e) { if (!pointerActive) return; pointerCurrentX = e.touches ? e.touches[0].clientX : e.clientX; }
    function handlePointerUp() { pointerActive = false; pointerStartX = 0; pointerCurrentX = 0; usePointer = false; }

    window.addEventListener('touchstart', handlePointerDown, {passive: true}); window.addEventListener('touchmove', handlePointerMove, {passive: true}); window.addEventListener('touchend', handlePointerUp);
    window.addEventListener('mousedown', handlePointerDown); window.addEventListener('mousemove', handlePointerMove); window.addEventListener('mouseup', handlePointerUp);

    // --- ЛОГИКА ---
    function update() {
        if (gameState !== 'playing') return;
        player.time += 0.05;

        let moveDir = 0;
        if (keys.left) moveDir = -1; else if (keys.right) moveDir = 1;
        if (moveDir === 0 && usePointer && pointerActive) {
            const diff = pointerCurrentX - pointerStartX;
            if (diff < -15 / sensitivity) moveDir = -1; else if (diff > 15 / sensitivity) moveDir = 1;
        }

        player.x += moveDir * 9 * sensitivity;
        player.tilt += (moveDir * 0.2 - player.tilt) * 0.2;
        if (player.x + player.width < 0) player.x = width;
        if (player.x > width) player.x = -player.width;

        player.vy += GRAVITY; player.y += player.vy;

        if (player.vy > 0) {
            platforms.forEach(p => {
                if (p.broken) return;
                if (player.x + player.width > p.x && player.x < p.x + p.width && player.y + player.height > p.y && player.y + player.height < p.y + p.height + player.vy + 15) {
                    if (p.hasSpring) {
                        player.vy = SPRING_FORCE; p.hasSpring = false; playSound(500, 'sine', 0.2);
                        for(let i=0; i<10; i++) particles.push({ x: player.x + player.width/2, y: p.y, vx: (Math.random()-0.5)*6, vy: Math.random()*4, life: 1, color: '#00ff88' });
                    } else {
                        player.vy = JUMP_FORCE; playSound(300, 'sine', 0.1);
                        for(let i=0; i<6; i++) particles.push({ x: player.x + player.width/2, y: player.y + player.height, vx: (Math.random()-0.5)*4, vy: Math.random()*2 + 1, life: 1, color: p.type === 'breakable' ? '#ffaa00' : '#fff' });
                    }
                    if (p.type === 'breakable') { p.broken = true; p.breakTimer = 15; playSound(150, 'sawtooth', 0.2); }
                }
            });
        }

        gameCoins.forEach((c, index) => {
            if (c.collected) return;
            if (Math.hypot(player.x + player.width/2 - c.x, player.y + player.height/2 - c.y) < 40) {
                c.collected = true; coins++; score += 5;
                localStorage.setItem('nj_coins', coins); document.getElementById('coins-display').innerText = coins;
                playSound(800, 'sine', 0.1);
                for(let i=0; i<8; i++) particles.push({ x: c.x, y: c.y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4, life: 1, color: '#ffcc00' });
                gameCoins.splice(index, 1);
            }
        });

        platforms.forEach(p => {
            if (p.type === 'moving' && !p.broken) { p.x += p.vx; if (p.x <= 0 || p.x + p.width >= width) p.vx *= -1; }
            if (p.broken) p.breakTimer--;
            if (p.hasCoin && !p.broken) { p.hasCoin = false; gameCoins.push({ x: p.x + p.width/2, y: p.y - 30, collected: false, rot: 0 }); }
        });

        platforms = platforms.filter(p => !p.broken || p.breakTimer > 0);
        platforms = platforms.filter(p => p.y < height + 300);

        if (player.y < height / 3) {
            const scroll = height / 3 - player.y;
            player.y += scroll; platforms.forEach(p => p.y += scroll); gameCoins.forEach(c => c.y += scroll);
            stars.forEach(s => { s.y += scroll * (s.layer === 1 ? 0.3 : 0.8); if(s.y > height) s.y = 0; });
            nebulas.forEach(n => { n.y += scroll * n.speed; if(n.y - n.radius > height) n.y = -n.radius; });
            bgParticles.forEach(p => { p.y += scroll * 0.5; if(p.y > height) p.y = -10; });
            
            score += Math.floor(scroll); document.getElementById('score').innerText = score;
            if (Math.floor(score / 100) > Math.floor((score - Math.floor(scroll)) / 100)) { coins++; localStorage.setItem('nj_coins', coins); document.getElementById('coins-display').innerText = coins; }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let pt = particles[i]; pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.2; pt.life -= 0.03;
            if (pt.life <= 0) particles.splice(i, 1);
        }
        gameCoins.forEach(c => c.rot += 0.1);
        generateNewPlatforms();

        if (player.y > height + 150) {
            gameState = 'gameover';
            let isNewRecord = false;
            if (score > highScore) { highScore = score; localStorage.setItem('nj_highscore', highScore); document.getElementById('highscore').innerText = highScore; isNewRecord = true; }
            document.getElementById('final-score').innerText = score;
            document.getElementById('record-badge').style.display = isNewRecord ? 'inline-block' : 'none';
            document.getElementById('game-over-modal').classList.add('open');
            playSound(100, 'square', 0.5);
        }
    }

    // --- ОТРИСОВКА ПЕРСОНАЖЕЙ (v4.0) ---
    function drawPlayer() {
        ctx.save();
        ctx.translate(player.x + player.width/2, player.y + player.height/2);
        ctx.rotate(player.tilt);
        const w = player.width, h = player.height, t = player.time;

        if (currentChar === 'default') {
            ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(-w/2 + 5, -h/2 + 5, w, h);
            ctx.fillStyle = '#888'; ctx.fillRect(-w/2, -h/2, w, h + 4);
            ctx.shadowBlur = 15; ctx.shadowColor = '#fff'; ctx.fillStyle = '#fff'; ctx.fillRect(-w/2, -h/2, w, h); ctx.shadowBlur = 0;
            ctx.fillStyle = '#000'; const eo = player.tilt > 0 ? 3 : (player.tilt < 0 ? -3 : 0);
            ctx.beginPath(); ctx.arc(-w/4 + eo, -h/4, 4, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(w/4 + eo, -h/4, 4, 0, Math.PI*2); ctx.fill();
        } 
        else if (currentChar === 'ninja') {
            ctx.save(); ctx.translate(0, -h/2 + 5); ctx.rotate(-0.8);
            ctx.fillStyle = '#00ffff'; ctx.shadowBlur = 15; ctx.shadowColor = '#00ffff'; ctx.fillRect(-3, -h/2 - 10, 6, h + 20);
            ctx.fillStyle = '#333'; ctx.shadowBlur = 0; ctx.fillRect(-5, h/2, 10, 8);
            ctx.fillStyle = '#ffcc00'; ctx.fillRect(-6, h/2 + 6, 12, 3); ctx.restore();
            ctx.fillStyle = '#1a1a1a'; ctx.fillRect(-w/2, -h/2, w, h); ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 2; ctx.strokeRect(-w/2, -h/2, w, h);
            ctx.fillStyle = '#00ffff'; ctx.shadowBlur = 10; ctx.shadowColor = '#00ffff'; ctx.fillRect(-w/2, -h/2 + 6, w, 14); ctx.shadowBlur = 0;
            ctx.fillStyle = '#ff00ff'; for(let i=0; i<3; i++) ctx.fillRect(-w/2 - 5, -h/2 + 10 + i*4, 8 + Math.sin(t + i)*4, 4);
            ctx.fillStyle = '#fff'; const eo = player.tilt > 0 ? 3 : (player.tilt < 0 ? -3 : 0);
            ctx.fillRect(-w/2 + 6 + eo, -h/2 + 10, 8, 3); ctx.fillRect(-w/2 + 22 + eo, -h/2 + 10, 8, 3);
        } 
        else if (currentChar === 'golden_bear') {
            ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(-w/2 + 5, -h/2 + 5, w, h);
            ctx.fillStyle = '#cc9900'; ctx.beginPath(); ctx.arc(-w/2 + 4, -h/2 + 8, 7, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(w/2 - 4, -h/2 + 8, 7, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#ffcc00'; ctx.shadowBlur = 15; ctx.shadowColor = '#ffcc00'; ctx.fillRect(-w/2, -h/2, w, h); ctx.shadowBlur = 0;
            ctx.fillStyle = '#111'; ctx.fillRect(-w/4, -h/2 - 12, w/2, 12); ctx.fillRect(-w/2 + 4, -h/2 - 2, w - 8, 3);
            ctx.fillStyle = '#e6b800'; ctx.fillRect(-w/2 + 8, -h/2 + 12, w - 16, 16);
            const eo = player.tilt > 0 ? 2 : (player.tilt < 0 ? -2 : 0);
            ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-w/4 + eo, -h/4, 5, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(w/4 + eo, -h/4, 5, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-w/4 + eo + 1.5, -h/4 - 1.5, 1.5, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(w/4 + eo + 1.5, -h/4 - 1.5, 1.5, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#000'; ctx.fillRect(-3, -h/4 + 6, 6, 4);
            ctx.beginPath(); ctx.moveTo(0, h/2 - 10); ctx.lineTo(-6, h/2 - 14); ctx.lineTo(-6, h/2 - 6); ctx.fill();
            ctx.beginPath(); ctx.moveTo(0, h/2 - 10); ctx.lineTo(6, h/2 - 14); ctx.lineTo(6, h/2 - 6); ctx.fill();
        } 
        else if (currentChar === 'ghost') {
            // Улучшенный призрак (рваный, жуткий)
            const levitate = Math.sin(t) * 4;
            ctx.translate(0, levitate);
            ctx.fillStyle = 'rgba(200, 0, 255, 0.4)';
            ctx.shadowBlur = 25; ctx.shadowColor = '#ff00ff';
            
            // Руки-ветки
            ctx.beginPath(); ctx.ellipse(-w/2 - 8, -h/4 + Math.sin(t*1.5)*5, 5, 15, -0.8, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(w/2 + 8, -h/4 + Math.sin(t*1.5+1)*5, 5, 15, 0.8, 0, Math.PI*2); ctx.fill();

            // Тело с рваным низом
            ctx.beginPath(); ctx.arc(0, -h/4, w/2, Math.PI, 0);
            ctx.lineTo(w/2, h/4);
            const wave = Math.sin(t*3) * 6;
            ctx.lineTo(w/3, h/2 + wave); ctx.lineTo(w/6, h/4 - wave); ctx.lineTo(0, h/2 + wave*1.5); ctx.lineTo(-w/6, h/4 - wave); ctx.lineTo(-w/3, h/2 + wave); ctx.lineTo(-w/2, h/4);
            ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;

            // Глаза (пустые, но с искрой)
            ctx.fillStyle = '#000'; const eo = player.tilt > 0 ? 3 : (player.tilt < 0 ? -3 : 0);
            ctx.beginPath(); ctx.ellipse(-w/4 + eo, -h/4, 5, 7, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(w/4 + eo, -h/4, 5, 7, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.shadowBlur = 10; ctx.shadowColor = '#fff';
            ctx.beginPath(); ctx.arc(-w/4 + eo, -h/4 + 1, 1.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(w/4 + eo, -h/4 + 1, 1.5, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        }
        else if (currentChar === 'goblin') {
            // Гоблин в шапке
            ctx.fillStyle = '#004400'; ctx.fillRect(-w/2, -h/2 + 8, w, h - 8); // Тело
            ctx.fillStyle = '#00aa00'; ctx.beginPath(); ctx.arc(0, -h/4, w/2, 0, Math.PI*2); ctx.fill(); // Голова
            // Уши
            ctx.beginPath(); ctx.moveTo(-w/2, -h/4); ctx.lineTo(-w/2 - 10, -h/4 - 5); ctx.lineTo(-w/2, -h/4 + 5); ctx.fill();
            ctx.beginPath(); ctx.moveTo(w/2, -h/4); ctx.lineTo(w/2 + 10, -h/4 - 5); ctx.lineTo(w/2, -h/4 + 5); ctx.fill();
            // Шапка
            ctx.fillStyle = '#cc0000'; ctx.beginPath(); ctx.moveTo(-w/2, -h/4 - 4); ctx.lineTo(0, -h/2 - 20); ctx.lineTo(w/2, -h/4 - 4); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, -h/2 - 20, 4, 0, Math.PI*2); ctx.fill();
            // Глаза
            ctx.fillStyle = '#ffcc00'; const eo = player.tilt > 0 ? 2 : (player.tilt < 0 ? -2 : 0);
            ctx.fillRect(-w/4 + eo, -h/4, 6, 4); ctx.fillRect(w/4 + eo - 6, -h/4, 6, 4);
            ctx.fillStyle = '#000'; ctx.fillRect(-w/4 + eo + 2, -h/4 + 1, 2, 2); ctx.fillRect(w/4 + eo - 4, -h/4 + 1, 2, 2);
            // Нос
            ctx.fillStyle = '#008800'; ctx.beginPath(); ctx.moveTo(0, -h/4 + 4); ctx.lineTo(-3, -h/4 + 10); ctx.lineTo(3, -h/4 + 10); ctx.fill();
        }
        else if (currentChar === 'spider') {
            // Паук
            ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(0, 0, w/2.5, 0, Math.PI*2); ctx.fill(); // Брюшко
            // Ноги
            ctx.strokeStyle = '#111'; ctx.lineWidth = 3;
            for(let i=0; i<4; i++) {
                ctx.beginPath(); ctx.moveTo(-w/4, 0); ctx.lineTo(-w/2 - 10, -15 + i*10); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(w/4, 0); ctx.lineTo(w/2 + 10, -15 + i*10); ctx.stroke();
            }
            // Глаза (много)
            ctx.fillStyle = '#ff0000'; ctx.shadowBlur = 10; ctx.shadowColor = '#ff0000';
            ctx.beginPath(); ctx.arc(-8, -8, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(8, -8, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(-4, -12, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(4, -12, 2, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        }
        else if (currentChar === 'robot') {
            // Робот
            ctx.fillStyle = '#aaa'; ctx.fillRect(-w/2, -h/2, w, h); // Тело
            ctx.fillStyle = '#666'; ctx.fillRect(-w/2, -h/2, w, 8); // Голова
            // Антенна
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, -h/2); ctx.lineTo(0, -h/2 - 10); ctx.stroke();
            ctx.fillStyle = '#ff0000'; ctx.beginPath(); ctx.arc(0, -h/2 - 10, 3, 0, Math.PI*2); ctx.fill();
            // Глаза
            ctx.fillStyle = '#00ffff'; ctx.shadowBlur = 15; ctx.shadowColor = '#00ffff';
            const eo = player.tilt > 0 ? 2 : (player.tilt < 0 ? -2 : 0);
            ctx.fillRect(-w/4 + eo, -h/4, 8, 4); ctx.fillRect(w/4 + eo - 8, -h/4, 8, 4);
            ctx.shadowBlur = 0;
        }
        else if (currentChar === 'gecko') {
            // Геккон
            ctx.fillStyle = '#00ff00'; ctx.beginPath(); ctx.ellipse(0, 0, w/2, h/3, 0, 0, Math.PI*2); ctx.fill();
            // Лапки
            ctx.fillStyle = '#006600';
            ctx.beginPath(); ctx.arc(-w/2, -h/4, 5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(w/2, -h/4, 5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(-w/2, h/4, 5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(w/2, h/4, 5, 0, Math.PI*2); ctx.fill();
            // Хвост
            ctx.strokeStyle = '#00ff00'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-w/2, 0); ctx.quadraticCurveTo(-w/2 - 15, 0, -w/2 - 10, 15); ctx.stroke();
            // Глаза
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-w/4, -h/4, 5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(w/4, -h/4, 5, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#000'; ctx.fillRect(-w/4 - 1, -h/4 - 2, 2, 4); ctx.fillRect(w/4 - 1, -h/4 - 2, 2, 4);
        }
        else if (currentChar === 'axolotl') {
            // Аксолотль
            ctx.fillStyle = '#ffb6c1'; ctx.beginPath(); ctx.arc(0, 0, w/2, 0, Math.PI*2); ctx.fill(); // Тело
            // Жабры
            ctx.fillStyle = '#ff69b4';
            ctx.beginPath(); ctx.ellipse(-w/2, -h/4, 8, 15, -0.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(w/2, -h/4, 8, 15, 0.5, 0, Math.PI*2); ctx.fill();
            // Глаза
            ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-w/4, -h/4, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(w/4, -h/4, 4, 0, Math.PI*2); ctx.fill();
            // Улыбка
            ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, h/4, 8, 0, Math.PI); ctx.stroke();
        }

        ctx.restore();
    }

    // --- ОТРИСОВКА МИРА (ЛОКАЦИИ) ---
    function draw() {
        const loc = locations.find(l => l.id === currentLoc) || locations[0];
        
        const bgGradient = ctx.createLinearGradient(0, 0, 0, height);
        bgGradient.addColorStop(0, loc.bg1);
        bgGradient.addColorStop(1, loc.bg2);
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, width, height);

        // СПЕЦИФИЧНЫЕ ФОНЫ
        if (currentLoc === 'volcano') {
            // Каменная арка (гора)
            ctx.fillStyle = '#220505';
            ctx.beginPath(); ctx.moveTo(0, height); ctx.lineTo(width/4, height/3); ctx.lineTo(width/2, height/2.5); ctx.lineTo(width*0.75, height/3); ctx.lineTo(width, height); ctx.fill();
            
            // Лава
            ctx.fillStyle = '#ff4400'; ctx.shadowBlur = 20; ctx.shadowColor = '#ff4400';
            ctx.beginPath(); ctx.moveTo(width/2, height/2.5); ctx.lineTo(width/2 - 40, height); ctx.lineTo(width/2, height); ctx.lineTo(width/2 + 20, height/2.5 + 50); ctx.fill();
            ctx.beginPath(); ctx.moveTo(width*0.75, height/3); ctx.lineTo(width*0.8, height); ctx.lineTo(width*0.85, height); ctx.lineTo(width*0.75 + 20, height/3 + 60); ctx.fill();
            ctx.shadowBlur = 0;

            // Огненное свечение снизу
            const fireGrad = ctx.createRadialGradient(width/2, height, 0, width/2, height, height);
            fireGrad.addColorStop(0, 'rgba(255, 50, 0, 0.4)'); fireGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = fireGrad; ctx.fillRect(0, 0, width, height);
        } 
        else if (currentLoc === 'ice') {
            // Сталактиты
            ctx.fillStyle = 'rgba(0, 150, 255, 0.4)';
            for(let i=0; i<8; i++) { let x = i * (width/8) + 20; ctx.beginPath(); ctx.moveTo(x-15, 0); ctx.lineTo(x+15, 0); ctx.lineTo(x, 40 + Math.sin(i)*20); ctx.fill(); }
            // Туман
            ctx.fillStyle = 'rgba(0, 100, 255, 0.05)'; ctx.fillRect(0, height/2, width, height/2);
        }
        else if (currentLoc === 'sakura') {
            // Гора Фудзи и сакура на фоне
            ctx.fillStyle = '#2a1a2a';
            ctx.beginPath(); ctx.moveTo(0, height); ctx.lineTo(width/2, height/2); ctx.lineTo(width, height); ctx.fill();
            ctx.fillStyle = '#ffb7c5';
            ctx.beginPath(); ctx.arc(width*0.2, height*0.7, 40, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(width*0.8, height*0.6, 50, 0, Math.PI*2); ctx.fill();
            // Лепестки
            ctx.fillStyle = 'rgba(255, 182, 193, 0.6)';
            for(let i=0; i<20; i++) {
                let px = (i * 50 + Date.now()/20) % width;
                let py = (i * 30 + Date.now()/10) % height;
                ctx.beginPath(); ctx.ellipse(px, py, 4, 2, Math.PI/4, 0, Math.PI*2); ctx.fill();
            }
        }
        else if (currentLoc === 'ocean') {
            // Водоросли и пузыри
            ctx.strokeStyle = 'rgba(0, 255, 100, 0.3)'; ctx.lineWidth = 10;
            for(let i=0; i<6; i++) {
                let x = i * (width/6) + 50;
                ctx.beginPath(); ctx.moveTo(x, height); ctx.quadraticCurveTo(x + Math.sin(Date.now()/1000 + i)*20, height/2, x, height/3); ctx.stroke();
            }
            // Свет сверху
            const lightGrad = ctx.createLinearGradient(0, 0, 0, height);
            lightGrad.addColorStop(0, 'rgba(0, 200, 255, 0.2)'); lightGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = lightGrad; ctx.fillRect(0, 0, width, height);
        }

        // Туманности
        nebulas.forEach(n => {
            const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.radius);
            grad.addColorStop(0, loc.nebula[0]); grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2); ctx.fill();
        });

        // Звезды
        stars.forEach(s => {
            s.y -= s.speed;
            if (s.y < 0) { s.y = height; s.x = Math.random() * width; }
            ctx.fillStyle = `rgba(255, 255, 255, ${s.layer === 1 ? 0.2 : 0.6})`;
            ctx.beginPath(); ctx.arc(s.x, s.y, s.layer === 1 ? s.size * 0.5 : s.size, 0, Math.PI * 2); ctx.fill();
        });

        // Частицы фона
        bgParticles.forEach(p => {
            if (currentLoc === 'volcano') {
                ctx.fillStyle = `rgba(255, ${Math.random()*100+100}, 0, 0.8)`;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI*2); ctx.fill();
                p.y -= p.speed * 2;
            } else if (currentLoc === 'ice') {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                p.y += p.speed;
            } else if (currentLoc === 'sakura') {
                ctx.fillStyle = 'rgba(255, 182, 193, 0.8)';
                ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size, p.size/2, Math.PI/4, 0, Math.PI*2); ctx.fill();
                p.y += p.speed; p.x += Math.sin(p.y*0.05)*2;
            } else if (currentLoc === 'ocean') {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size*2, 0, Math.PI*2); ctx.stroke();
                p.y -= p.speed; // Пузыри вверх
            } else {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.fillRect(p.x, p.y, p.size * 5, 1);
                p.y += p.speed; p.x -= p.speed;
            }
            if (p.y > height) { p.y = -10; p.x = Math.random() * width; }
            if (p.y < -10) { p.y = height + 10; p.x = Math.random() * width; }
        });

        // Платформы
        platforms.forEach(p => {
            if (p.broken && p.breakTimer <= 0) return;
            let topColor, sideColor;
            if (p.type === 'normal') { topColor = '#fff'; sideColor = '#888'; }
            else if (p.type === 'breakable') { topColor = p.broken ? '#f00' : '#ffaa00'; sideColor = '#b35900'; }
            else { topColor = '#00ffff'; sideColor = '#008888'; }

            ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(p.x + 5, p.y + 5, p.width, p.height);
            ctx.fillStyle = sideColor; ctx.fillRect(p.x, p.y, p.width, p.height + 5);
            ctx.shadowBlur = 10; ctx.shadowColor = topColor; ctx.fillStyle = topColor;
            ctx.fillRect(p.x, p.y, p.width, p.height); ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(p.x, p.y, p.width, 3);

            if (p.hasSpring) {
                ctx.fillStyle = '#00ff88'; ctx.shadowBlur = 10; ctx.shadowColor = '#00ff88';
                ctx.fillRect(p.x + p.width/2 - 10, p.y - 15, 20, 15);
                ctx.fillStyle = '#fff'; ctx.fillRect(p.x + p.width/2 - 15, p.y - 20, 30, 5);
                ctx.shadowBlur = 0;
            }
        });

        // Монеты
        gameCoins.forEach(c => {
            ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
            ctx.fillStyle = '#ffcc00'; ctx.shadowBlur = 15; ctx.shadowColor = '#ffcc00';
            ctx.beginPath(); ctx.ellipse(0, 0, 12, 12 * Math.abs(Math.cos(c.rot)), 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(0, 0, 6, 6 * Math.abs(Math.cos(c.rot)), 0, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        });

        // Частицы
        particles.forEach(pt => {
            ctx.globalAlpha = pt.life; ctx.fillStyle = pt.color; ctx.fillRect(pt.x, pt.y, 4, 4);
        });
        ctx.globalAlpha = 1;

        // Игрок
        drawPlayer();
    }

    function loop() {
        if (gameState === 'playing') update();
        draw();
        requestAnimationFrame(loop);
    }

    // --- ИНТЕРФЕЙС ---
    function togglePause() { if (gameState === 'gameover') return; if (gameState === 'playing') { gameState = 'paused'; document.getElementById('pause-modal').classList.add('open'); } else if (gameState === 'paused') { gameState = 'playing'; document.getElementById('pause-modal').classList.remove('open'); } }
    function openMenu() { if (gameState !== 'menu' && gameState !== 'gameover') { prevGameState = gameState; gameState = 'menu'; } renderShop(); document.getElementById('menu-modal').classList.add('open'); }
    function closeMenu() { document.getElementById('menu-modal').classList.remove('open'); if (gameState === 'menu') { if (prevGameState === 'playing') gameState = 'playing'; else if (prevGameState === 'paused') { gameState = 'paused'; document.getElementById('pause-modal').classList.add('open'); } else restartGame(); } }
    function goToMenu() { gameState = 'menu'; prevGameState = 'gameover'; document.getElementById('game-over-modal').classList.remove('open'); document.getElementById('pause-modal').classList.remove('open'); renderShop(); document.getElementById('menu-modal').classList.add('open'); }
    function restartGame() { gameState = 'playing'; player.x = width / 2 - 20; player.y = height - 150; player.vy = 0; player.tilt = 0; score = 0; particles = []; gameCoins = []; document.getElementById('score').innerText = '0'; document.getElementById('game-over-modal').classList.remove('open'); document.getElementById('pause-modal').classList.remove('open'); document.getElementById('menu-modal').classList.remove('open'); initPlatforms(); initStars(); }

    initPlatforms(); initStars(); loop();

    document.getElementById('sound-slider').addEventListener('input', (e) => { soundVolume = e.target.value / 100; document.getElementById('sound-val').innerText = e.target.value + '%'; });
    document.getElementById('sens-slider').addEventListener('input', (e) => { sensitivity = 0.4 + (e.target.value / 100) * 0.8; document.getElementById('sens-val').innerText = e.target.value + '%'; });

</script>
