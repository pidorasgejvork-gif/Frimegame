<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON JUMP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { 
            margin: 0; padding: 0; overflow: hidden; background: #000; 
            display: flex; justify-content: center; align-items: center; height: 100vh; 
            font-family: 'Outfit', sans-serif; touch-action: none; 
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        /* Игровой UI */
        #score-container { 
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            color: #fff; pointer-events: none; text-align: center; z-index: 10;
            display: flex; flex-direction: column; align-items: center;
        }
        #score-label { font-size: 10px; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; opacity: 0.6; margin-bottom: -2px; }
        #score { font-size: 48px; font-weight: 900; letter-spacing: -1px; text-shadow: 0 0 20px rgba(255,255,255,0.5); line-height: 1; }
        
        /* Рекорд под счетчиком */
        #highscore-container {
            display: flex; align-items: center; gap: 5px; margin-top: 4px;
            font-size: 14px; font-weight: 900; color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
            letter-spacing: 1px; background: rgba(0,0,0,0.4);
            padding: 3px 10px; border-radius: 10px; border: 1px solid rgba(255, 204, 0, 0.2);
        }
        #highscore-container svg { width: 14px; height: 14px; fill: #ffcc00; }

        /* Кнопки управления */
        .top-btn {
            position: absolute; top: 20px; z-index: 30; cursor: pointer;
            width: 44px; height: 44px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; gap: 4px;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px; backdrop-filter: blur(5px); transition: 0.2s;
        }
        .top-btn:hover { background: rgba(255,255,255,0.2); }
        .top-btn:active { transform: scale(0.95); }
        
        #pause-btn { left: 20px; }
        #menu-btn { right: 20px; }

        .pause-icon { width: 16px; height: 18px; border-left: 5px solid #fff; border-right: 5px solid #fff; }
        .menu-icon { width: 20px; height: 2px; background: #fff; position: relative; }
        .menu-icon::before, .menu-icon::after { content: ''; position: absolute; left: 0; width: 20px; height: 2px; background: #fff; }
        .menu-icon::before { top: -6px; }
        .menu-icon::after { top: 6px; }

        /* Модальные окна */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(12px);
            display: none; justify-content: center; align-items: center;
            z-index: 40; padding: 20px;
        }
        .modal-overlay.open { display: flex; }

        .modal-box {
            background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
            border: 1px solid #333; border-radius: 28px;
            width: 100%; max-width: 380px; padding: 35px; color: #fff;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 40px rgba(255,255,255,0.05);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; text-align: center;
        }
        @keyframes popIn { from { transform: scale(0.85) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }

        .modal-title {
            font-size: 32px; font-weight: 900; margin-bottom: 25px;
            letter-spacing: -1px; text-transform: uppercase;
        }
        
        .close-btn {
            position: absolute; top: 15px; right: 15px; width: 34px; height: 34px;
            background: rgba(255,255,255,0.1); border: none; border-radius: 50%;
            color: #fff; font-size: 18px; cursor: pointer; display: flex;
            justify-content: center; align-items: center; transition: 0.2s;
        }
        .close-btn:hover { background: rgba(255,255,255,0.2); transform: rotate(90deg); }

        /* Настройки */
        .setting-row { margin-bottom: 25px; text-align: left; }
        .setting-label { 
            display: flex; justify-content: space-between; 
            font-size: 13px; font-weight: 700; margin-bottom: 10px; color: #aaa;
            text-transform: uppercase; letter-spacing: 1px;
        }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; outline: none; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; background: #222; border-radius: 4px; cursor: pointer; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 22px; width: 22px; border-radius: 50%;
            background: #fff; cursor: pointer; margin-top: -7px;
            box-shadow: 0 0 15px rgba(255,255,255,0.4); transition: 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.15); }

        /* Вкладки */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab {
            flex: 1; padding: 12px; background: #1a1a1a; border: 1px solid #333;
            border-radius: 12px; text-align: center; font-weight: 700; font-size: 13px;
            cursor: pointer; transition: 0.2s; color: #888;
        }
        .tab.active { background: #fff; color: #000; border-color: #fff; }
        
        .tab-content { 
            display: none; text-align: center; padding: 40px 0; 
            color: #555; font-size: 16px; font-weight: 700; letter-spacing: 2px;
        }
        .tab-content.active { display: block; }

        /* Пауза */
        .pause-btn {
            width: 100%; padding: 18px; margin-bottom: 12px;
            border-radius: 16px; border: none; font-family: 'Outfit', sans-serif;
            font-size: 18px; font-weight: 900; cursor: pointer; transition: 0.2s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-resume { background: #fff; color: #000; }
        .btn-resume:hover { background: #ddd; transform: scale(1.02); }
        .btn-restart { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid #333; }
        .btn-restart:hover { background: rgba(255,255,255,0.1); transform: scale(1.02); }

        /* Game Over */
        .gameover-title { color: #ff3366; text-shadow: 0 0 30px rgba(255, 51, 102, 0.5); font-size: 38px; margin-bottom: 5px; }
        .final-score-label { font-size: 14px; font-weight: 900; color: #666; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 5px; }
        .final-score { font-size: 72px; font-weight: 900; color: #fff; line-height: 1; margin-bottom: 25px; text-shadow: 0 0 30px rgba(255,255,255,0.3); }
        
        .record-badge {
            display: inline-block; background: rgba(255, 215, 0, 0.15); color: #ffd700;
            padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 900;
            letter-spacing: 1px; margin-bottom: 25px; border: 1px solid rgba(255, 215, 0, 0.3);
            text-transform: uppercase; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }

    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    
    <div id="score-container">
        <div id="score-label">Score</div>
        <div id="score">0</div>
        <div id="highscore-container">
            <svg viewBox="0 0 24 24"><path d="M19 3h-2V1H7v2H5c-1.1 0-2 .9-2 2v3c0 2.4 1.7 4.4 4 4.9V15c0 1.1.9 2 2 2h2v2H8v2h8v-2h-3v-2h2c1.1 0 2-.9 2-2v-2.1c2.3-.5 4-2.5 4-4.9V5c0-1.1-.9-2-2-2zM5 8V5h2v3c0 1-.4 1.9-1 2.5C5.4 9.9 5 9 5 8zm14 0c0 1-.4 1.9-1 2.5-.6-.6-1-1.5-1-2.5V5h2v3z"/></svg>
            <span id="highscore">0</span>
        </div>
    </div>
    
    <div id="pause-btn" class="top-btn" onclick="togglePause()">
        <div class="pause-icon"></div>
    </div>
    
    <div id="menu-btn" class="top-btn" onclick="openMenu()">
        <div class="menu-icon"></div>
    </div>

    <!-- Пауза -->
    <div id="pause-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title">PAUSED</div>
            <button class="pause-btn btn-resume" onclick="togglePause()">RESUME</button>
            <button class="pause-btn btn-restart" onclick="restartGame()">RESTART</button>
            <button class="pause-btn btn-restart" onclick="goToMenu()">MAIN MENU</button>
        </div>
    </div>

    <!-- Меню -->
    <div id="menu-modal" class="modal-overlay">
        <div class="modal-box">
            <button class="close-btn" onclick="closeMenu()">✕</button>
            <div class="modal-title">SETTINGS</div>
            
            <div class="setting-row">
                <div class="setting-label"><span>Sound Volume</span><span id="sound-val">50%</span></div>
                <input type="range" id="sound-slider" min="0" max="100" value="50">
            </div>

            <div class="setting-row">
                <div class="setting-label"><span>Sensitivity</span><span id="sens-val">50%</span></div>
                <input type="range" id="sens-slider" min="10" max="100" value="50">
            </div>

            <div class="tabs">
                <div class="tab active" onclick="switchTab('chars', this)">Characters</div>
                <div class="tab" onclick="switchTab('levels', this)">Locations</div>
            </div>

            <div id="tab-chars" class="tab-content active">COMING SOON</div>
            <div id="tab-levels" class="tab-content">COMING SOON</div>
        </div>
    </div>

    <!-- Game Over -->
    <div id="game-over-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title gameover-title">GAME OVER</div>
            <div class="final-score-label">Your Score</div>
            <div class="final-score" id="final-score">0</div>
            <div id="record-badge" class="record-badge" style="display: none;">🏆 New Record!</div>
            <button class="pause-btn btn-resume" onclick="restartGame()">TRY AGAIN</button>
            <button class="pause-btn btn-restart" onclick="goToMenu()">MAIN MENU</button>
        </div>
    </div>

<script>
    // --- ЗВУК ---
    let audioCtx = null;
    let soundVolume = 0.5;
    let sensitivity = 1.0;

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playSound(freq, type, duration) {
        if (soundVolume === 0) return;
        try {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(soundVolume * 0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    // --- НАСТРОЙКИ ---
    const soundSlider = document.getElementById('sound-slider');
    const sensSlider = document.getElementById('sens-slider');
    const soundVal = document.getElementById('sound-val');
    const sensVal = document.getElementById('sens-val');

    soundSlider.addEventListener('input', (e) => {
        soundVolume = e.target.value / 100;
        soundVal.innerText = e.target.value + '%';
    });

    sensSlider.addEventListener('input', (e) => {
        sensitivity = 0.4 + (e.target.value / 100) * 0.8; 
        sensVal.innerText = e.target.value + '%';
    });

    // --- КАНВАС ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;

    function resizeCanvas() {
        if (window.innerWidth > 600) {
            width = 600;
            height = Math.min(window.innerHeight, 900);
        } else {
            width = window.innerWidth;
            height = window.innerHeight;
        }
        canvas.width = width;
        canvas.height = height;
    }
    
    resizeCanvas();
    window.addEventListener('resize', () => {
        resizeCanvas();
        initPlatforms();
    });

    // --- ПЕРЕМЕННЫЕ ---
    let gameState = 'playing'; // playing, paused, gameover, menu
    let score = 0;
    let highScore = parseInt(localStorage.getItem('neonjump_highscore') || '0');
    
    let particles = [];
    let stars = [];

    const GRAVITY = 0.55;
    const JUMP_FORCE = -15;
    
    const player = {
        x: width / 2 - 20,
        y: height - 150,
        vx: 0,
        vy: 0,
        width: 36,
        height: 36,
        color: '#fff',
        tilt: 0
    };

    let platforms = [];
    let PLATFORM_WIDTH = 80;
    let PLATFORM_HEIGHT = 20;

    let keys = { left: false, right: false };
    let touchStartX = null;
    let touchCurrentX = null;

    // Инициализация рекорда в UI
    document.getElementById('highscore').innerText = highScore;

    window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
    });
    window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    });

    window.addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].clientX;
        touchCurrentX = touchStartX;
    }, {passive: true});
    
    window.addEventListener('touchmove', (e) => {
        if (touchStartX === null) return;
        touchCurrentX = e.touches[0].clientX;
    }, {passive: true});

    window.addEventListener('touchend', () => {
        touchStartX = null;
        touchCurrentX = null;
    });

    // --- ГЕНЕРАЦИЯ ---
    function createPlatform(y, type = 'normal') {
        let x = Math.random() * (width - PLATFORM_WIDTH);
        return {
            x: x, y: y, width: PLATFORM_WIDTH, height: PLATFORM_HEIGHT,
            type: type, vx: type === 'moving' ? (Math.random() > 0.5 ? 3 : -3) : 0,
            broken: false, breakTimer: 0
        };
    }

    function initPlatforms() {
        platforms = [];
        platforms.push({
            x: width / 2 - PLATFORM_WIDTH / 2, y: height - 100,
            width: PLATFORM_WIDTH, height: PLATFORM_HEIGHT,
            type: 'normal', vx: 0, broken: false, breakTimer: 0
        });

        let currentY = height - 200;
        while (currentY > -height) {
            let type = 'normal';
            const r = Math.random();
            if (r < 0.25) type = 'breakable';
            else if (r < 0.5) type = 'moving';
            
            platforms.push(createPlatform(currentY, type));
            currentY -= (80 + Math.random() * 50);
        }
    }

    function generateNewPlatforms() {
        let minY = 0;
        platforms.forEach(p => { if (p.y < minY) minY = p.y; });

        if (minY > -height) {
            let type = 'normal';
            const r = Math.random();
            if (r < 0.25) type = 'breakable';
            else if (r < 0.5) type = 'moving';
            
            const gap = 80 + Math.random() * 50;
            platforms.push(createPlatform(minY - gap, type));
        }
    }

    function initStars() {
        stars = [];
        for(let i=0; i<80; i++) {
            stars.push({
                x: Math.random() * width, y: Math.random() * height,
                size: Math.random() * 2.5 + 1, speed: Math.random() * 2 + 1
            });
        }
    }

    // --- ЛОГИКА ---
    function update() {
        if (gameState !== 'playing') return;

        let moveDir = 0;
        if (keys.left) moveDir = -1;
        else if (keys.right) moveDir = 1;
        
        if (touchStartX !== null && touchCurrentX !== null) {
            const diff = touchCurrentX - touchStartX;
            if (diff < -15 / sensitivity) moveDir = -1;
            else if (diff > 15 / sensitivity) moveDir = 1;
        }

        const speed = 9 * sensitivity;
        player.x += moveDir * speed;
        player.tilt += (moveDir * 0.2 - player.tilt) * 0.2;

        if (player.x + player.width < 0) player.x = width;
        if (player.x > width) player.x = -player.width;

        player.vy += GRAVITY;
        player.y += player.vy;

        if (player.vy > 0) {
            platforms.forEach(p => {
                if (p.broken) return;
                const xOverlap = player.x + player.width > p.x && player.x < p.x + p.width;
                const yOverlap = player.y + player.height > p.y && player.y + player.height < p.y + p.height + player.vy + 15;

                if (xOverlap && yOverlap) {
                    player.vy = JUMP_FORCE;
                    playSound(300, 'sine', 0.1);
                    
                    for(let i=0; i<6; i++) {
                        particles.push({
                            x: player.x + player.width/2, y: player.y + player.height,
                            vx: (Math.random()-0.5)*4, vy: Math.random()*2 + 1,
                            life: 1, color: p.type === 'breakable' ? '#ffaa00' : '#fff'
                        });
                    }

                    if (p.type === 'breakable') {
                        p.broken = true;
                        p.breakTimer = 15;
                        playSound(150, 'sawtooth', 0.2);
                    }
                }
            });
        }

        platforms.forEach(p => {
            if (p.type === 'moving' && !p.broken) {
                p.x += p.vx;
                if (p.x <= 0 || p.x + p.width >= width) p.vx *= -1;
            }
            if (p.broken) p.breakTimer--;
        });

        platforms = platforms.filter(p => !p.broken || p.breakTimer > 0);
        platforms = platforms.filter(p => p.y < height + 300);

        if (player.y < height / 3) {
            const scroll = height / 3 - player.y;
            player.y += scroll;
            platforms.forEach(p => p.y += scroll);
            stars.forEach(s => { s.y += scroll * 0.5; if(s.y > height) s.y = 0; });
            
            score += Math.floor(scroll);
            document.getElementById('score').innerText = score;
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let pt = particles[i];
            pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.2; pt.life -= 0.03;
            if (pt.life <= 0) particles.splice(i, 1);
        }

        generateNewPlatforms();

        // --- ПРОИГРЫШ ---
        if (player.y > height + 150) {
            gameState = 'gameover';
            
            // Проверка рекорда
            let isNewRecord = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('neonjump_highscore', highScore);
                document.getElementById('highscore').innerText = highScore;
                isNewRecord = true;
            }

            document.getElementById('final-score').innerText = score;
            document.getElementById('record-badge').style.display = isNewRecord ? 'inline-block' : 'none';
            document.getElementById('game-over-modal').classList.add('open');
            
            playSound(100, 'square', 0.5);
        }
    }

    function draw() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, width, height);

        stars.forEach(s => {
            s.y -= 1;
            if (s.y < 0) { s.y = height; s.x = Math.random() * width; }
            ctx.fillStyle = `rgba(255, 255, 255, ${s.speed / 3})`;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
        });

        platforms.forEach(p => {
            if (p.broken && p.breakTimer <= 0) return;

            let topColor, sideColor;
            if (p.type === 'normal') { topColor = '#fff'; sideColor = '#888'; }
            else if (p.type === 'breakable') { topColor = p.broken ? '#f00' : '#ffaa00'; sideColor = '#b35900'; }
            else { topColor = '#00ffff'; sideColor = '#008888'; }

            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(p.x + 5, p.y + 5, p.width, p.height);
            ctx.fillStyle = sideColor;
            ctx.fillRect(p.x, p.y, p.width, p.height + 5);
            ctx.fillStyle = topColor;
            ctx.fillRect(p.x, p.y, p.width, p.height);
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.fillRect(p.x, p.y, p.width, 3);
        });

        particles.forEach(pt => {
            ctx.globalAlpha = pt.life;
            ctx.fillStyle = pt.color;
            ctx.fillRect(pt.x, pt.y, 4, 4);
        });
        ctx.globalAlpha = 1;

        ctx.save();
        ctx.translate(player.x + player.width/2, player.y + player.height/2);
        ctx.rotate(player.tilt);
        
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(-player.width/2 + 5, -player.height/2 + 5, player.width, player.height);
        ctx.fillStyle = '#888';
        ctx.fillRect(-player.width/2, -player.height/2, player.width, player.height + 4);
        ctx.fillStyle = player.color;
        ctx.fillRect(-player.width/2, -player.height/2, player.width, player.height);
        
        ctx.fillStyle = '#000';
        const eyeOffset = player.tilt > 0 ? 3 : (player.tilt < 0 ? -3 : 0);
        ctx.fillRect(-player.width/2 + 8 + eyeOffset, -player.height/2 + 10, 6, 8);
        ctx.fillRect(-player.width/2 + 22 + eyeOffset, -player.height/2 + 10, 6, 8);

        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.fillRect(-player.width/2 + 2, -player.height/2 + 2, player.width - 4, 2);
        
        ctx.restore();
    }

    function loop() {
        if (gameState === 'playing') update();
        draw();
        requestAnimationFrame(loop);
    }

    // --- ИНТЕРФЕЙС ---
    function togglePause() {
        if (gameState === 'gameover') return;
        if (gameState === 'playing') {
            gameState = 'paused';
            document.getElementById('pause-modal').classList.add('open');
        } else if (gameState === 'paused') {
            gameState = 'playing';
            document.getElementById('pause-modal').classList.remove('open');
        }
    }

    function openMenu() {
        if (gameState === 'playing') togglePause();
        document.getElementById('menu-modal').classList.add('open');
    }

    function closeMenu() {
        document.getElementById('menu-modal').classList.remove('open');
    }

    // ФУНКЦИЯ ДЛЯ ПЕРЕХОДА В ГЛАВНОЕ МЕНЮ ИЗ ИГРЫ ИЛИ GAME OVER
    function goToMenu() {
        gameState = 'menu'; // Меняем состояние, чтобы игра не обновлялась
        document.getElementById('game-over-modal').classList.remove('open');
        document.getElementById('pause-modal').classList.remove('open');
        
        // Сбрасываем игровые параметры (но не трогаем рекорд)
        player.x = width / 2 - 20;
        player.y = height - 150;
        player.vy = 0;
        player.tilt = 0;
        score = 0;
        document.getElementById('score').innerText = '0';
        
        // Открываем меню настроек как "главное меню"
        document.getElementById('menu-modal').classList.add('open');
    }

    function switchTab(tabName, btn) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + tabName).classList.add('active');
    }

    function restartGame() {
        gameState = 'playing';
        player.x = width / 2 - 20;
        player.y = height - 150;
        player.vy = 0;
        player.tilt = 0;
        score = 0;
        particles = [];
        document.getElementById('score').innerText = '0';
        document.getElementById('game-over-modal').classList.remove('open');
        document.getElementById('pause-modal').classList.remove('open');
        document.getElementById('menu-modal').classList.remove('open');
        initPlatforms();
        initStars();
    }

    // Старт
    initPlatforms();
    initStars();
    loop();

</script>
</body>
    </html>
